name: Android APK

on:
  push:
    branches:
      - main
      - development
      - integration/quanlian-core
      - 'feature/**'
  pull_request:
    branches:
      - main
      - development
      - integration/quanlian-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Kotlin and Android sources
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Validate signed release variant with a temporary CI-only key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/xiaoli-ci-release.jks
          ANDROID_STORE_PASSWORD: ci-only-store-password
          ANDROID_KEY_ALIAS: xiaoli-ci
          ANDROID_KEY_PASSWORD: ci-only-key-password
        run: |
          keytool -genkeypair -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=XiaoLi CI Only,O=XiaoLi,C=SG" -noprompt
          gradle --no-daemon lintRelease testReleaseUnitTest assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoLiLauncher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XiaoLiLauncher-lint-report
          path: '**/build/reports/lint-results-debug.html'
          if-no-files-found: ignore
